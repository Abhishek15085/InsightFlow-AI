# ============================================================
# InsightFlow AI — Docker Compose
# Phase 0: Placeholder — orchestrates backend + frontend
# ============================================================

version: "3.9"

services:
  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: insightflow_backend
    ports:
      - "8000:8000"
    volumes:
      - ./datasets:/app/datasets
      - ./chroma_db:/app/chroma_db
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    # Run uvicorn normally without reload for production
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  # React Frontend (served via Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: insightflow_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
